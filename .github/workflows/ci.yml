name: CI

# Runs the documented test + lint suite (README § Tests and lint) on
# every pull request and every push to main. Linux is the canonical
# host target — the Tauri GUI crate links against the system WebView,
# so the webkit2gtk dev libraries are installed before the Rust build.
#
# Also exposed as a reusable workflow (`workflow_call`) so the release
# workflow runs these exact checks as a gate before building any bundle
# — a release never publishes from a commit whose tests/clippy fail.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rustdoc:
    name: rustdoc links (workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # cargo doc builds every workspace crate's dependency graph, and
      # cannet-gui's includes the GTK/WebKit -sys crates on Linux —
      # without their native libraries glib-sys's build script fails
      # before a single doc is rendered.
      - name: Install WebView host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libxdo-dev             libssl-dev             libsoup-3.0-dev             libjavascriptcoregtk-4.1-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A broken rustdoc link renders as literal text rather than
      # failing anything, so nothing catches one at review: 75 had
      # accumulated across the workspace before this job existed.
      - name: cargo doc (workspace)
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    # A wedged test run fails here, with logs, instead of idling out the
    # 6-hour default. Green runs take 2-7 minutes (observed across cache
    # states); 20 is ~3x the worst of those.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install WebView host libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # rust-toolchain.toml pins the version + clippy component; rustup
      # installs exactly that, so CI matches local.
      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # The workspace's tests manage real process trees (the sidecar
      # supervisor kills process groups), so the suite runs under its own
      # session: a stray group-directed signal stops at this boundary —
      # the step fails and keeps its logs — instead of reaching the
      # runner agent, which loses the job *and* the logs that would have
      # explained it.
      - run: setsid --wait cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  wire-breaking:
    name: Wire protocol (buf breaking)
    runs-on: ubuntu-latest
    steps:
      # The whole history, and its tags: the comparison point is the
      # last release tag, and a shallow checkout has neither.
      # `GIT_LFS_SKIP_SMUDGE` is for buf's own clone of this
      # repository — it has no LFS endpoint configured and would fail
      # fetching the example captures it does not need.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A single static binary, pinned here. Not used for codegen —
      # tonic-build and grpcio-tools keep that — so nothing else in the
      # build depends on this version.
      - name: Install buf
        run: npm install -g @bufbuild/buf@1.47.2

      # The mechanical half of the wire compatibility rule (ADR 0059):
      # the package name is the major version, and only additive
      # changes may land inside one. A renumbered tag, a changed field
      # type, a removed field — anything a released client could
      # already be depending on — fails here rather than in the field.
      - name: buf breaking, against the last release
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$tag" ]; then
            echo "No release tag reachable; nothing to be compatible with yet."
            exit 0
          fi
          echo "Comparing against $tag"
          buf breaking crates/cannet-wire/proto \
            --against ".git#tag=$tag,subdir=crates/cannet-wire/proto"

  wire-gencode:
    name: Wire protocol (python gencode drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.21"
          enable-cache: true
          cache-dependency-glob: servers/cannet-python-can/uv.lock

      # The python packages carry their protobuf/grpc stubs in the tree
      # so an end user needs no protoc. That only holds if the stubs and
      # the `.proto` cannot drift apart, and nothing else checks it:
      # before this job, a proto edit that skipped the regeneration
      # shipped a sidecar speaking the previous schema.
      - name: Regenerate every checked-in gencode tree
        run: bash scripts/regen-proto-gencode.sh

      - name: Fail on any difference
        run: |
          if ! git diff --exit-code; then
            echo "::error::The committed python gencode does not match crates/cannet-wire/proto."
            echo "Run 'bash scripts/regen-proto-gencode.sh' and commit the result."
            exit 1
          fi

  mdf-export-oracle:
    name: MDF export (asammdf oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2

      # asammdf is the ecosystem's reference MDF implementation and this
      # is the one place cannet asks its opinion: a file the writer just
      # produced is opened by an outside reader and compared, field for
      # field, against what went into it. Deliberately its own job — the
      # `rust` job's `cargo test --workspace` stays Python-free, so the
      # default suite never needs an interpreter.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.21"

      - name: Write a sample capture
        run: cargo run -p cannet-mdf --example export_sample -- "${RUNNER_TEMP}/sample.mf4"

      - name: Validate it with asammdf
        run: |
          uv run --with asammdf --with numpy python \
            crates/cannet-mdf/tests/fixtures/validate_export.py "${RUNNER_TEMP}/sample.mf4"

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          # Exact Node version pinned in .node-version (read by local
          # version managers too), so CI and local match.
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml

      - run: pnpm --dir apps/gui install --frozen-lockfile
      - run: pnpm --dir apps/gui test
      - run: pnpm --dir apps/gui build

  python-wire:
    name: Python wire (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/cannet-python-wire
    steps:
      - uses: actions/checkout@v7

      # Same uv pin and cache shape as its two consumers below.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.21"
          enable-cache: true
          cache-dependency-glob: libs/cannet-python-wire/uv.lock

      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

      # `cannet_python_wire/_proto` is checked in so neither of this
      # package's consumers — the sidecar and the python-can client,
      # which take it by path dependency — needs a `protoc` install,
      # and it is the one encoding of the wire in the repository.
      # Regenerating it here and diffing the tree is the simplest
      # deterministic guard against someone editing `cannet.proto`
      # without re-running the script that produces it: no drift means
      # no diff.
      - name: Check the checked-in gencode matches cannet.proto
        run: |
          uv run --extra dev bash scripts/regen_proto.sh
          git diff --exit-code -- cannet_python_wire/_proto

  python:
    name: Python sidecar (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servers/cannet-local-sidecar
    steps:
      - uses: actions/checkout@v7

      # uv version is pinned for reproducibility; the tool + dependency
      # versions themselves come from the committed uv.lock. uv installs
      # the Python 3.13 the sidecar requires on its own.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.21"
          enable-cache: true
          cache-dependency-glob: servers/cannet-local-sidecar/uv.lock

      - run: uv sync --extra dev --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest


  python-client:
    name: Python client (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The integration half of the suite runs against `cannet-server`'s
      # debug modes on loopback, so the binary has to exist. The
      # fixtures skip when it does not, and a suite that silently
      # skipped its integration tests here would be worth very little.
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p cannet-server

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.21"
          enable-cache: true
          cache-dependency-glob: clients/cannet-python-client/uv.lock

      - run: uv sync --extra dev --frozen
        working-directory: clients/cannet-python-client
      - run: uv run ruff check .
        working-directory: clients/cannet-python-client
      - run: uv run ruff format --check .
        working-directory: clients/cannet-python-client
      - run: uv run mypy
        working-directory: clients/cannet-python-client
      - run: uv run pytest
        working-directory: clients/cannet-python-client

  sidecar-freeze:
    name: Frozen sidecar (freeze + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # uv provisions the CPython pinned by
      # servers/cannet-local-sidecar/.python-version and the sidecar's
      # locked deps; the build script drives PyInstaller from there.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.21"
          enable-cache: true
          cache-dependency-glob: servers/cannet-local-sidecar/uv.lock

      # Freeze the onedir and smoke-run the frozen launcher (the script's
      # default). Executing the artifact is the only thing that exercises
      # the --collect-submodules / importlib driver-load paths and proves
      # the embedded interpreter boots, so a collection regression fails
      # here — per-PR, cheaply, and OS-independently — instead of on a
      # release runner or a user's machine. The outer script is
      # stdlib-only; the pinned interpreter comes from the inner
      # `uv run --project` it spawns.
      - name: Freeze + smoke-test the sidecar
        run: uv run --no-project scripts/build-sidecar.py
