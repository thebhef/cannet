name: Release

# Cuts a release on demand. Trigger it from the Actions tab ("Run
# workflow") and supply the version, e.g. `0.1.0`. The workflow:
#   1. runs the full CI suite as a gate (no publish if it fails),
#   2. injects the version into the bundle config, commits that edit to
#      the runner's throwaway checkout, and tags the result `vX.Y.Z` (so
#      the binary's vergen `git describe` version matches and the tree it
#      describes is clean — see "Commit + tag" below), and
#   3. builds unsigned GUI bundles on native runners (Tauri cannot
#      cross-compile) — macOS Apple Silicon (aarch64) and Windows x64.
#      Each bundle *contains* `cannet-server`, staged as a resource
#      beside the frozen sidecar it supervises, and each leg
#      additionally packs a `cannet-server-vX.Y.Z-<target>` archive
#      (the same server binary + the same `cannet-python-can` onedir)
#      beside the GUI bundle — plus a native server installer (macOS
#      `.pkg`, Windows NSIS `.exe`), and
#   4. builds a Linux x64 `cannet-server` archive and `.deb` on its own
#      runner — cargo build + sidecar freeze + tar + cargo-deb, no
#      Tauri bundling — since cannet's Linux support is server-only for
#      now.
#   All artifacts publish to one draft pre-release for review: 2 GUI
#   bundles + 3 server archives + 3 server installers.
#
# A server installer puts `cannet-server` where a terminal finds it —
# the NSIS one appends its install directory to the user `PATH`, the
# pkg drops an `/etc/paths.d` entry, the deb symlinks
# `/usr/bin/cannet-server` — and keeps the frozen sidecar
# onedir beside the binary, which is where the server's own probe
# looks. None of them starts anything.
#
# Tick **Dry run** to build every one of those artifacts while touching
# nothing outside the run: no remote tag, no draft release. That is how
# you get an installable test build of a branch — the way to exercise
# hardware CI cannot reach (a multi-channel Kvaser card, say) is to
# download the installer onto the machine the device is plugged into.
# Artifacts attach to the workflow run in *both* modes, so a real
# release is downloadable straight off the run too, without opening the
# draft.
#
# CI builds on every push to main are cheap (Linux); the expensive
# cross-platform bundle build runs only here, when you actually release
# or ask for a test build. The committed version stays 0.0.0.
#
# Signing / notarization is a deliberate follow-up — see
# plans/tasks/0026-distribution-and-ci.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 0.1.0 (no leading v)"
        required: true
        type: string
      # A dry run still takes a version above: it names the artifacts,
      # and the local (never-pushed) tag stamps it into the binaries, so
      # a test build reports its version like any other build. Nothing
      # is published, so reusing one version across dry runs is fine.
      dry_run:
        description: "Dry run — build the artifacts, create no tag and no release"
        type: boolean
        default: false

permissions:
  contents: write

# A real release takes one shared lock, so two can never interleave. A
# dry run takes a per-ref lock instead: a test build neither blocks a
# release nor queues behind another branch's test build. Spelled through
# `github.event.inputs` (a string) rather than the `inputs` context
# because this key is evaluated before any job starts; the step-level
# `if:` conditions below use the typed boolean.
concurrency:
  group: ${{ github.event.inputs.dry_run == 'true' && format('release-dry-{0}', github.ref) || 'release' }}
  cancel-in-progress: false

jobs:
  # Gate: run the full CI suite (test + clippy + frontend) first. The
  # bundle jobs depend on this, so a release never publishes from a
  # commit whose checks fail.
  verify:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  bundle:
    name: Bundle (${{ matrix.label }})
    needs: verify
    # Both matrix legs compute the same tag from the same input, so
    # either leg's value is correct here — the Linux server-only job
    # below reads it instead of re-deriving it.
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS arm64
            rust-target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
            # `args` names an explicit --target, so the bundle lands
            # under that triple's directory.
            bundle-glob: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-latest
            label: Windows x64
            rust-target: x86_64-pc-windows-msvc
            args: ""
            # No --target, so the bundle lands in the host default's.
            bundle-glob: target/release/bundle/nsis/*-setup.exe
    runs-on: ${{ matrix.platform }}
    # Job-wide so both this leg's explicit staging step and the bundle
    # step's beforeBuildCommand (which runs the same script) build for —
    # and stage from — one target directory. Without it the second run
    # would build the server again for the host default target.
    env:
      CANNET_SERVER_TARGET: ${{ matrix.rust-target }}
    steps:
      # The Windows runner's machine gitconfig sets core.autocrlf=true,
      # so a default checkout writes CRLF working files and records the
      # converted sizes in the index. `tauri build` later rewrites
      # src-tauri/Cargo.toml in place with LF endings (a byte-identical
      # no-op against the committed blob), which that CRLF index can
      # never reconcile — git reports the file modified from then on,
      # and the GUI binary's vergen `git describe --dirty` stamp picks
      # up `-dirty` even though nothing real changed (the clean-stamp
      # assert below runs before `tauri build`, so it cannot catch
      # this). Check out as-committed (LF) instead; then the rewrite
      # really is a no-op. On the macOS leg autocrlf is already off —
      # this is a harmless no-op there.
      - name: Force as-committed (LF) checkout
        shell: bash
        run: git config --global core.autocrlf input

      - uses: actions/checkout@v7
        with:
          # Full history + tags so vergen's `git describe` resolves the
          # tag created below.
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - uses: actions/setup-node@v7
        with:
          # Exact Node version pinned in .node-version (read by local
          # version managers too), so CI and local match.
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: apps/gui/pnpm-lock.yaml

      # rust-toolchain.toml pins the version; add the per-platform target.
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          rustup target add ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@v2

      # The installer/bundle version comes from the input; the committed
      # tauri.conf.json and packager.toml stay 0.0.0. cargo-packager has
      # no version-override flag, so its config is patched the same way
      # — both edits are committed below so the tree is clean when
      # vergen reads it.
      - name: Set bundle version
        shell: bash
        run: |
          node -e "const fs=require('fs'),p='apps/gui/src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='${{ steps.ver.outputs.version }}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          PKG=crates/cannet-server/packaging/packager.toml
          # `-i.bak` (suffix attached) is the one in-place form both GNU
          # and macOS BSD sed accept; bare `-i` makes BSD sed eat the
          # script as the backup suffix and fail on the filename.
          sed -i.bak 's/^version = "0\.0\.0"$/version = "${{ steps.ver.outputs.version }}"/' "$PKG"
          rm -f "$PKG.bak"
          grep -q '^version = "${{ steps.ver.outputs.version }}"$' "$PKG" \
            || { echo "::error::the version placeholder in $PKG did not substitute"; exit 1; }

      # vergen stamps the binary with `git describe --tags --dirty`, and
      # the step above modifies a *tracked* file — so tagging before it
      # (as this workflow used to) made every released binary report
      # `vX.Y.Z-dirty`. Commit the edit to this throwaway checkout first,
      # then tag: `describe` then resolves to exactly `vX.Y.Z` over a
      # clean tree. The commit is local to the runner and never pushed —
      # tauri-action creates the real tag through the API — so the
      # committed version in the repository still stays 0.0.0.
      - name: Commit + tag the version bump (local, for vergen)
        shell: bash
        run: |
          git -c user.name='cannet release' \
              -c user.email='release@users.noreply.github.com' \
              commit -m "release: bundle version ${{ steps.ver.outputs.version }}" \
              -- apps/gui/src-tauri/tauri.conf.json \
                 crates/cannet-server/packaging/packager.toml
          git tag "${{ steps.ver.outputs.tag }}"

      - run: pnpm --dir apps/gui install --frozen-lockfile

      # Freeze the python-can sidecar for THIS runner's OS/arch before
      # the bundle step picks it up as a Tauri resource (ADR 0036).
      # PyInstaller cannot cross-compile, so each native runner freezes
      # its own; uv provisions the pinned CPython and the locked deps —
      # no separate setup-python. The build script smoke-runs the frozen
      # launcher by default (asserts the `sidecar\tlistening` banner, and
      # on macOS the exec bit + ad-hoc arm64 signature), so a collection
      # or signing regression fails the release here instead of shipping
      # a dead sidecar.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.21"
          enable-cache: true
          cache-dependency-glob: servers/cannet-python-can/uv.lock

      # Guard the invariant the commit-then-tag step exists for: whatever
      # a release runner ends up writing before the bundle build, the
      # tree must be clean when vergen reads it. Fail here — loudly, and
      # before the expensive build — rather than shipping a `-dirty`
      # binary. Last chance to check: the sidecar freeze and `pnpm build`
      # run inside the step below, as `beforeBuildCommand`.
      - name: Assert the version stamp is clean
        shell: bash
        run: |
          DESCRIBE="$(git describe --tags --dirty)"
          echo "vergen will stamp: $DESCRIBE"
          if [ "$DESCRIBE" != "${{ steps.ver.outputs.tag }}" ]; then
            echo "::error::expected the stamp to be exactly ${{ steps.ver.outputs.tag }}; the working tree is not clean at stamp time:"
            git status --porcelain
            exit 1
          fi

      # Independent of the GUI bundle — cannet-server has no frontend
      # and no vergen version stamp — so build it before the expensive
      # Tauri step to fail fast on a server-only regression. The staging
      # script's `cargo build -p` restricts the build to this crate and
      # its dependency graph, which does not reach the GUI crate, then
      # copies the binary into `apps/gui/src-tauri/server-dist/` so the
      # bundle step below picks it up as a resource (every GUI install
      # ships the server). `CANNET_SERVER_TARGET` is set job-wide, so
      # the bundle step's own beforeBuildCommand run of this script
      # re-stages the *same* artifact instead of building a second one
      # for the host default target.
      - name: Build and stage cannet-server (release)
        shell: bash
        run: uv run --no-project scripts/stage-server.py

      - name: Build and publish bundle
        if: ${{ !inputs.dry_run }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/gui
          # Creates the remote tag + draft pre-release on first matrix
          # job; the second uploads its bundle to the same release.
          tagName: ${{ steps.ver.outputs.tag }}
          releaseName: cannet ${{ steps.ver.outputs.tag }}
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}

      # The same build, minus `tagName` — withholding it is precisely
      # what stops tauri-action creating a tag or a release, so this
      # step needs no token either. The bundle it leaves on disk is
      # collected by the upload step below.
      - name: Build bundle (dry run)
        if: ${{ inputs.dry_run }}
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: apps/gui
          args: ${{ matrix.args }}

      # The Tauri build above just froze this runner's
      # `cannet-python-can` onedir as a bundle resource (ADR 0036); the
      # server archive reuses that exact artifact rather than freezing
      # a second time. Archive layout: the onedir sits beside the
      # binary as `cannet-python-can/`, which is where
      # `cannet-server`'s own discovery looks
      # (`crates/cannet-server/src/main.rs`), not `sidecar/`.
      - name: Package server archive (macOS tar.gz)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          NAME="cannet-server-${{ steps.ver.outputs.tag }}-${{ matrix.rust-target }}"
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.rust-target }}/release/cannet-server" "$STAGE/"
          cp -R apps/gui/src-tauri/sidecar-dist/cannet-python-can "$STAGE/cannet-python-can"
          tar -czf "$RUNNER_TEMP/$NAME.tar.gz" -C "$RUNNER_TEMP" "$NAME"
          echo "SERVER_ARCHIVE_PATH=$RUNNER_TEMP/$NAME.tar.gz" >> "$GITHUB_ENV"

      # The macOS server installer is a flat package built with Apple's
      # own `pkgbuild` (present on every macOS runner, so no dependency
      # to install). Everything lands under one prefix so the binary
      # keeps the frozen onedir beside it, and `/etc/paths.d` — read by
      # `path_helper` from `/etc/profile` — is what puts that prefix on
      # every login shell's PATH without editing anyone's dotfiles. A
      # flat package has no uninstaller; removing the two paths is the
      # documented undo (README § Running the production server).
      #
      # Unverifiable from a Windows dev box, so every input is checked
      # before it is packaged and the output is checked after: a `.pkg`
      # that silently shipped without its sidecar would look fine until
      # someone installed it.
      - name: Package server installer (macOS pkg)
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.rust-target }}/release/cannet-server"
          ONEDIR="apps/gui/src-tauri/sidecar-dist/cannet-python-can"
          for input in "$BIN" "$ONEDIR"; do
            [ -e "$input" ] || { echo "::error::$input is missing; the pkg would ship without it"; exit 1; }
          done
          PREFIX="$RUNNER_TEMP/pkgroot/usr/local/cannet-server"
          mkdir -p "$PREFIX" "$RUNNER_TEMP/pkgroot/etc/paths.d"
          cp "$BIN" "$PREFIX/"
          cp -R "$ONEDIR" "$PREFIX/cannet-python-can"
          echo "/usr/local/cannet-server" > "$RUNNER_TEMP/pkgroot/etc/paths.d/cannet-server"
          [ -x "$PREFIX/cannet-server" ] || { echo "::error::the staged server lost its exec bit"; exit 1; }
          [ -x "$PREFIX/cannet-python-can/cannet-python-can" ] || { echo "::error::the staged sidecar launcher lost its exec bit"; exit 1; }
          PKG="$RUNNER_TEMP/cannet-server-${{ steps.ver.outputs.tag }}-${{ matrix.rust-target }}.pkg"
          pkgbuild \
            --root "$RUNNER_TEMP/pkgroot" \
            --identifier co.hefnet.cannet-server \
            --version "${{ steps.ver.outputs.version }}" \
            --ownership recommended \
            --install-location / \
            "$PKG"
          [ -f "$PKG" ] || { echo "::error::pkgbuild reported success but $PKG is missing"; exit 1; }
          echo "SERVER_INSTALLER_PATH=$PKG" >> "$GITHUB_ENV"

      # Windows gets a .zip, not a .tar.gz: the platform's own bundle
      # format in this workflow (NSIS .exe) is already a Windows-native
      # installer, and zip is the Windows-native archive format
      # (native `Compress-Archive`, no tar dependency), matching that
      # same native-to-the-platform choice.
      - name: Package server archive (Windows zip)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $Name = "cannet-server-${{ steps.ver.outputs.tag }}-${{ matrix.rust-target }}"
          $Stage = Join-Path $env:RUNNER_TEMP $Name
          New-Item -ItemType Directory -Path $Stage | Out-Null
          Copy-Item "target/${{ matrix.rust-target }}/release/cannet-server.exe" -Destination $Stage
          Copy-Item -Recurse "apps/gui/src-tauri/sidecar-dist/cannet-python-can" -Destination (Join-Path $Stage "cannet-python-can")
          $ArchivePath = Join-Path $env:RUNNER_TEMP "$Name.zip"
          Compress-Archive -Path $Stage -DestinationPath $ArchivePath
          "SERVER_ARCHIVE_PATH=$ArchivePath" | Out-File -FilePath $env:GITHUB_ENV -Append

      # A CI/dev tool, never a workspace dependency. It brings its own
      # pinned NSIS toolchain, so the runner needs no NSIS install.
      - name: Install cargo-packager
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: cargo install cargo-packager --locked --version 0.11.8

      # The config reads the two directories the steps above already
      # filled — `server-dist/` (the staged release server) and
      # `sidecar-dist/` (this runner's frozen onedir) — so there is
      # nothing further to stage. Its `version` was patched from the
      # release input near the top of this job.
      - name: Package server installer (Windows NSIS)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          cargo packager -c crates/cannet-server/packaging/packager.toml
          SETUP="target/packager/cannet-server_${{ steps.ver.outputs.version }}_x64-setup.exe"
          [ -f "$SETUP" ] || { echo "::error::cargo-packager did not produce $SETUP"; ls -l target/packager || true; exit 1; }
          echo "SERVER_INSTALLER_PATH=$SETUP" >> "$GITHUB_ENV"

      # Stage into one workspace directory before uploading. The bundle
      # sits under `target/`, the server archive and installer under
      # RUNNER_TEMP — handing an upload those roots at once buries every
      # file under their deep shared prefix inside the artifact zip. A
      # flat directory keeps the download obvious. `set -e` plus an
      # unquoted glob also means a bundle that didn't get built fails
      # here, by name, rather than as a vague empty-artifact warning.
      - name: Stage this leg's artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          cp ${{ matrix.bundle-glob }} dist-artifacts/
          cp "$SERVER_ARCHIVE_PATH" "$SERVER_INSTALLER_PATH" dist-artifacts/
          ls -l dist-artifacts

      # Everything this leg produced, attached to the run itself. In a
      # dry run this is the only copy that exists; in a real release it
      # is a second, reviewable one. Every staged file is already a
      # compressed format, so re-compressing costs upload time and
      # saves nothing.
      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: cannet-${{ steps.ver.outputs.tag }}-${{ matrix.rust-target }}
          path: dist-artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload server archive to the draft release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.ver.outputs.tag }}" "$SERVER_ARCHIVE_PATH" --clobber --repo "${{ github.repository }}"

      - name: Upload server installer to the draft release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.ver.outputs.tag }}" "$SERVER_INSTALLER_PATH" --clobber --repo "${{ github.repository }}"

  # cannet's Linux support is server-only for now: no Tauri bundle, no
  # WebView host libraries, no frontend build — just the server binary
  # and the sidecar it supervises. Depends on `bundle` (which already
  # depends on `verify`) because it reads the tag string that job
  # computed rather than re-deriving it — and, in publish mode, uploads
  # to the tag/draft release that job creates.
  server-only:
    name: Server archive (Linux x64)
    needs: bundle
    runs-on: ubuntu-latest
    env:
      RUST_TARGET: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      # vergen stamps the binary with `git describe --tags`, and this
      # shallow, tag-less checkout gives it nothing to describe — the
      # released server then falls back to the crate version and
      # advertises `0.0.0` (see `build_version` in
      # `crates/cannet-server/src/main.rs`). Tag HEAD locally so the
      # stamp comes out as exactly the release tag; unlike the bundle
      # job there is no version edit to commit first (cargo-deb takes
      # `--deb-version`), so tagging alone suffices. Assert it, same as
      # the bundle legs do.
      - name: Tag the version locally (for vergen)
        run: |
          git tag "${{ needs.bundle.outputs.tag }}"
          DESCRIBE="$(git describe --tags --dirty)"
          echo "vergen will stamp: $DESCRIBE"
          if [ "$DESCRIBE" != "${{ needs.bundle.outputs.tag }}" ]; then
            echo "::error::expected the stamp to be exactly ${{ needs.bundle.outputs.tag }}; the working tree is not clean at stamp time:"
            git status --porcelain
            exit 1
          fi

      # rust-toolchain.toml pins the version. The host target already
      # is x86_64-unknown-linux-gnu on this runner, but add it
      # explicitly so `--target` below never relies on that by
      # accident.
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup target add "$RUST_TARGET"

      - uses: Swatinem/rust-cache@v2

      # uv provisions the CPython pinned by
      # servers/cannet-python-can/.python-version and the sidecar's
      # locked deps for the freeze below (ADR 0036) — the same setup
      # the other legs use for their own freeze.
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          version: "0.9.21"
          enable-cache: true
          cache-dependency-glob: servers/cannet-python-can/uv.lock

      - name: Freeze the python-can sidecar
        run: uv run --no-project scripts/build-sidecar.py

      # `-p` restricts the build to this crate and its dependency
      # graph, which does not reach `cannet-gui` (confirmed with
      # `cargo tree -p cannet-server`) — so this leg never needs the
      # WebView host libraries a `cannet-gui` build would (README §
      # Prerequisites → Linux) and correctly builds only the server.
      - name: Build cannet-server (release)
        run: cargo build --release -p cannet-server --target "$RUST_TARGET"

      - name: Package server archive (Linux tar.gz)
        run: |
          NAME="cannet-server-${{ needs.bundle.outputs.tag }}-$RUST_TARGET"
          STAGE="$RUNNER_TEMP/$NAME"
          mkdir -p "$STAGE"
          cp "target/$RUST_TARGET/release/cannet-server" "$STAGE/"
          cp -R apps/gui/src-tauri/sidecar-dist/cannet-python-can "$STAGE/cannet-python-can"
          tar -czf "$RUNNER_TEMP/$NAME.tar.gz" -C "$RUNNER_TEMP" "$NAME"
          echo "SERVER_ARCHIVE_PATH=$RUNNER_TEMP/$NAME.tar.gz" >> "$GITHUB_ENV"

      # A CI/dev tool, never a workspace dependency — same shape as
      # cargo-packager on the Windows leg.
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version 3.7.0

      # The layout lives in `[package.metadata.deb]`. `--no-build`
      # reuses the binary the step above already produced (the config's
      # `target/release` asset prefix is what cargo-deb rewrites for
      # `--target`), and `--no-strip` keeps that binary byte-for-byte
      # the one inside the tar.gz, so a panic backtrace from a .deb
      # install says the same thing as one from the archive. The
      # package's version is the release tag's; the crate's stays 0.0.0.
      - name: Package server installer (Linux deb)
        run: |
          set -euo pipefail
          TAG="${{ needs.bundle.outputs.tag }}"
          VERSION="${TAG#v}"
          cargo deb -p cannet-server --no-build --no-strip \
            --target "$RUST_TARGET" --deb-version "$VERSION"
          DEB="target/debian/cannet-server_${VERSION}_amd64.deb"
          [ -f "$DEB" ] || { echo "::error::cargo-deb did not produce $DEB"; ls -l target/debian || true; exit 1; }
          echo "SERVER_INSTALLER_PATH=$DEB" >> "$GITHUB_ENV"

      # As on the bundle legs: onto the run in both modes, into the
      # draft release only when publishing.
      - name: Stage this job's artifacts
        run: |
          set -euo pipefail
          mkdir -p dist-artifacts
          cp "$SERVER_ARCHIVE_PATH" "$SERVER_INSTALLER_PATH" dist-artifacts/
          ls -l dist-artifacts

      - name: Upload artifacts to the workflow run
        uses: actions/upload-artifact@v7
        with:
          name: cannet-server-${{ needs.bundle.outputs.tag }}-${{ env.RUST_TARGET }}
          path: dist-artifacts
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload server archive to the draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.bundle.outputs.tag }}" "$SERVER_ARCHIVE_PATH" --clobber --repo "${{ github.repository }}"

      - name: Upload server installer to the draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.bundle.outputs.tag }}" "$SERVER_INSTALLER_PATH" --clobber --repo "${{ github.repository }}"
