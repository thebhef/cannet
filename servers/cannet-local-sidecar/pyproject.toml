[project]
name = "cannet-local-sidecar"
version = "0.1.0"
description = "Auto-launched python-can sidecar exposing Vector, Kvaser, and PEAK hardware over the cannet wire protocol."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# Hard runtime deps. `cannet-python-wire` is a path dependency (see
# `[tool.uv.sources]`), not a published package: it is the repository's
# one encoding of the wire — the checked-in `_proto` gencode, the
# `Frame` the driver protocol passes around, and the mappers either
# side of it — shared with the python-can client so a second copy
# cannot drift from this one. `python-can` covers the three Phase-8
# vendors (Vector / Kvaser / PEAK) via its built-in backends. `grpcio` /
# `protobuf` let the sidecar speak the same `.proto` as `cannet-server`
# and `cannet-client`.
#
# `python-can` is deliberately handled as an optional import inside
# `driver_python_can.py` (the sidecar must boot and report "0
# interfaces" even when it's missing); declaring it here lets `uv sync`
# install it as part of the default flow.
#
# protobuf 7.35.1+ and grpcio 1.84.0+ are the floor — the exact
# versions the checked-in gencode's own `ValidateProtobufRuntimeVersion`
# / `GRPC_GENERATED_VERSION` checks demand, read off the regenerated
# stubs in `cannet-python-wire`. `uptime` is python-can's optional dep
# for Epoch-UTC timestamps on PEAK (and elsewhere); without it
# python-can falls back to boot-relative timestamps and warns. No
# upper bounds: we want `uv lock --upgrade` to pull current wheels and
# re-run smoke on bump — the three Python packages' locks are kept at
# one grpcio/protobuf/ruff version set across a re-lock, not by an
# upper pin here.
dependencies = [
    "cannet-python-wire",
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
    "python-can>=4.6",
    "uptime>=3",
]

[project.optional-dependencies]
# Pulled in by `uv sync --extra dev` for running tests. Kept out of the
# default install so the runtime venv stays small. Regenerating the
# proto stubs is `cannet-python-wire`'s job and `grpcio-tools` is in
# its dev extra, not here.
dev = [
    "pytest>=9",
    "ruff>=0.16,<0.17",
    "mypy>=1.15",
]

[project.scripts]
cannet-local-sidecar = "cannet_local_sidecar.__main__:main"

[tool.uv.sources]
cannet-python-wire = { path = "../../libs/cannet-python-wire" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cannet_local_sidecar"]

[tool.ruff]
target-version = "py313"

# The rule set ruff 0.15 was enforcing by default, made explicit so a
# ruff version bump never silently changes what's enforced. Identical
# across all three Python packages (see cannet-python-wire's
# pyproject.toml `dev` extra comment for why).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
files = ["cannet_local_sidecar"]
# Third-party runtime deps (python-can, grpc) ship without type stubs;
# the sidecar treats them dynamically already.
ignore_missing_imports = true

# The protobuf gencode is dynamically populated, so mypy can't see its
# attributes — treat it as untyped rather than annotate generated code.
[[tool.mypy.overrides]]
module = "cannet_python_wire._proto.*"
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow` marks load harnesses that run for minutes; `hardware` marks tests
# that open real adapters and wait for someone at the cable. The default
# run skips both; `-m slow` / `-m hardware` (which override this) select
# them.
markers = [
    "slow: load harness, minutes long; run with -m slow",
    "hardware: opens real adapters and waits on the cable; run with -m hardware",
]
addopts = "-m 'not slow and not hardware'"
