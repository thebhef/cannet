[package]
name = "cannet-log"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# Formatting an epoch-millisecond value as RFC 3339, nothing else — the
# wall clock is read through `std::time`, so the default features (and
# their platform clock backends) are not wanted.
chrono = { version = "0.4", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
