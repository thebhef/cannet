# Local commit gate. Every hook is repo:local / language:system — it runs a
# tool this project already pins (uv, cargo, pnpm) or a small script in
# scripts/, so there are no third-party hook repos to keep in sync. The
# checks are the ones in .github/workflows/ci.yml, narrowed to what a
# commit touches where that is a big enough saving to matter (each such
# hook says what it therefore leaves to CI). Enable in a clone with
# `pre-commit install` (needs the `pre-commit` tool: `uv tool install
# pre-commit` or `pipx install pre-commit`).
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: local
    hooks:
      # --- machine-local path guards (run first) ---

      # Rewrite absolute paths in example project files to paths relative to
      # the project file's own directory (ADR 0030), so a checked-in example
      # opens from any clone location.
      - id: relativize-project-paths
        name: relativize cannet project paths
        language: system
        files: '\.cannet_prj$'
        entry: python scripts/relativize_project_paths.py

      # Block any remaining machine-local absolute path in staged text.
      - id: check-local-paths
        name: block machine-local paths
        language: system
        types: [text]
        entry: python scripts/check_local_paths.py

      # --- Python sidecar (servers/cannet-python-can) ---

      # ruff takes file arguments, so these run on the staged files only.
      - id: ruff-check
        name: ruff check (sidecar)
        language: system
        files: '^servers/cannet-python-can/.*\.py$'
        exclude: '/_proto/'
        entry: uv run --project servers/cannet-python-can --frozen --extra dev ruff check --force-exclude
      - id: ruff-format
        name: ruff format (sidecar)
        language: system
        files: '^servers/cannet-python-can/.*\.py$'
        exclude: '/_proto/'
        entry: uv run --project servers/cannet-python-can --frozen --extra dev ruff format --check --force-exclude

      # mypy / pytest need the sidecar as their working directory (config
      # discovery), so they run the whole sidecar when any of its files change.
      - id: mypy
        name: mypy (sidecar)
        language: system
        files: '^servers/cannet-python-can/.*\.py$'
        pass_filenames: false
        entry: "bash -c 'cd servers/cannet-python-can && uv run --frozen --extra dev mypy'"
      - id: pytest
        name: pytest (sidecar)
        language: system
        files: '^servers/cannet-python-can/.*\.py$'
        pass_filenames: false
        entry: "bash -c 'cd servers/cannet-python-can && uv run --frozen --extra dev pytest'"

      # The freeze is heavy relative to the other hooks (~15 s warm,
      # ~60 s cold), so it fires only on the files that can actually
      # break it: the sidecar's dependency set, the freeze entry point,
      # and the build/licensing scripts themselves. CI runs it per-PR
      # unconditionally.
      - id: freeze-sidecar
        name: freeze + smoke sidecar
        language: system
        files: '^servers/cannet-python-can/(pyproject\.toml|uv\.lock|pyinstaller_entry\.py)$|^scripts/(build-sidecar|gen-licenses)\.py$'
        pass_filenames: false
        entry: uv run --no-project scripts/build-sidecar.py

      # --- Rust workspace ---
      # rustfmt runs first and re-stages what it touches, so formatting
      # lands in the same commit instead of the pre-commit-framework
      # default of aborting with "files were modified by this hook" (which
      # would make the user re-stage and commit again). clippy has no
      # per-file granularity, so it runs the workspace when any Rust
      # source or manifest changes; the test hook below is scoped.
      - id: cargo-fmt
        name: cargo fmt (workspace, auto-fix)
        language: system
        files: '\.rs$'
        pass_filenames: false
        entry: "bash -c 'cargo fmt --all && git add -u -- \"*.rs\"'"
      - id: cargo-clippy
        name: cargo clippy (workspace)
        language: system
        files: '\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$'
        pass_filenames: false
        entry: cargo clippy --workspace --all-targets -- -D warnings
      # Broken rustdoc links render as literal text rather than failing
      # anything, so nothing catches them at review: 41 accumulated
      # before this hook existed. `--no-deps` keeps it to our own crates
      # (documenting the dependency tree is minutes, not seconds), and
      # the crate root allows `private_intra_doc_links` with its reason,
      # so what -D warnings actually catches here is a link that does
      # not resolve at all.
      #
      # Scoped to cannet-gui: the library crates carry 34 warnings of
      # their own, equally pre-existing, and the allow above is an
      # app-crate argument that does not transfer to a library. Widening
      # this to --workspace is a separate decision.
      - id: cargo-doc
        name: cargo doc (rustdoc links)
        language: system
        files: '\.rs$|(^|/)Cargo\.(toml|lock)$'
        pass_filenames: false
        entry: bash -c 'RUSTDOCFLAGS="-D warnings" cargo doc -p cannet-gui --no-deps'
      # The test run is scoped to the crates a commit touches — the path
      # → package map is in scripts/cargo-test-touched.sh, and a root
      # manifest / toolchain change (or any Rust path with no rule) falls
      # back to the workspace.
      #
      # Measured on this repo, Windows, warm target dir, marginal cost on
      # top of the clippy hook above:
      #
      #   commit touching        scoped        `cargo test --workspace`
      #   crates/cannet-dbc      4 s           49 s
      #   apps/gui/src-tauri     24 s          47 s
      #   nothing to rebuild     1–5 s         17 s
      #
      # clippy does *not* make the tests free: it checks metadata only,
      # so `cargo test` still pays codegen and linking (4 s for
      # cannet-dbc, 24 s for cannet-gui, against 1–5 s when there is
      # nothing to rebuild).
      #
      # Dependents are deliberately NOT included. cannet-perf-measurement
      # and cannet-gui between them depend on nearly every crate, so
      # "touched crates + their dependents" is the entire workspace for
      # anything under crates/cannet-core or crates/cannet-blf, and costs
      # 42 s for a cannet-dbc change — i.e. it is the blanket run this
      # replaces, wearing a scoped name.
      #
      # So this gate can miss, and CI catches per-PR: a *behavioural*
      # break in a dependent crate's tests (a type break is still caught,
      # since clippy --all-targets compiles every test target), and
      # anything that only shows up under the workspace's unified feature
      # resolution. That feature resolution also means switching between
      # this scoped run and a hand-run `cargo test --workspace` rebuilds
      # (~25–45 s each way) — expected, not a fault.
      - id: cargo-test
        name: cargo test (touched crates)
        language: system
        files: '\.rs$|(^|/)Cargo\.(toml|lock)$|^rust-toolchain\.toml$'
        require_serial: true
        entry: bash scripts/cargo-test-touched.sh

      # --- Frontend (apps/gui, excluding the Rust src-tauri crate) ---
      # `pnpm build` is the typecheck and the whole vitest suite is the
      # test gate; the script runs them concurrently because they are
      # independent (42 s together, 67 s in sequence).
      #
      # The suite is deliberately not scoped to the changed files.
      # `vitest related` over the files of three real commits ran in
      # 20 / 28 / 30 s against 41 s for all 109 files — vitest's worker +
      # jsdom startup dominates, so scoping buys ~13 s — and it maps a
      # deleted file or a config change to *no* tests at all. Not worth
      # the hole.
      - id: frontend
        name: frontend build + tests
        language: system
        files: '^apps/gui/(?!src-tauri/).*'
        pass_filenames: false
        entry: bash scripts/frontend-gate.sh
