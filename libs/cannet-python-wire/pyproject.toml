[project]
name = "cannet-python-wire"
version = "0.1.0"
description = "The cannet wire encoding in Python: the checked-in gRPC gencode, the wire Frame, and the mappers either side of it."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# Hard runtime deps, and only what the moved code actually touches.
# `grpcio` / `protobuf` are what the checked-in gencode in `_proto/`
# needs to load and to serve; `python-can` is the other end of the
# `Message` <-> `Frame` seam. protobuf 6.x and grpcio 1.80+ are the
# floor — earlier protobuf can't load gencode emitted by current
# `grpc_tools.protoc`. No upper bounds: we want `uv lock --upgrade` to
# pull current wheels.
#
# `python-can` is imported defensively in `python_can.py` for the same
# reason the sidecar's driver does it: the sidecar must boot on a
# machine with no vendor SDK. Declaring it here lets `uv sync` install
# it as part of the default flow.
dependencies = [
    "grpcio>=1.80",
    "protobuf>=6",
    "python-can>=4.6",
]

[project.optional-dependencies]
# Pulled in by `uv sync --extra dev` for regenerating the proto stubs
# and running the tests. Kept out of the default install so the runtime
# venv stays small, matching the sidecar's and the client's split.
#
# ruff is held below 0.16 to match its two consumers. 0.16 *changes*
# its default selection rather than only widening it, so the same file
# lints differently on either side of the boundary — which is exactly
# what a shared package must not do.
#
# grpcio-tools is pinned to 1.80.x, and that pin is load-bearing:
# **the generator must never be newer than the oldest runtime any
# consumer locks.** Every generated stub records the toolchain that
# emitted it and refuses to import under an older one — `_pb2.py`
# against the protobuf runtime, `_pb2_grpc.py` against grpcio — and the
# sidecar locks grpcio 1.80.0 / protobuf 6.33.6. Regenerating with 1.81
# gives stubs demanding grpcio >= 1.81.1; with 1.82+, protobuf 7.x
# gencode. Either import-errors in the sidecar and the client the
# moment someone re-runs `scripts/regen_proto.sh`. Lifting this pin
# means moving every consumer's grpcio and protobuf in the same change.
# The CI gencode-drift check (ADR 0059) is what makes that a build
# failure rather than a latent one.
dev = [
    "grpcio-tools>=1.80,<1.81",
    "pytest>=9",
    "ruff>=0.9,<0.16",
    "mypy>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cannet_python_wire"]

# Generated gRPC/protobuf stubs live in `_proto/` and are excluded from
# linting, formatting, and type-checking — they're machine-emitted and
# regenerated, not hand-maintained.
[tool.ruff]
target-version = "py313"
extend-exclude = ["cannet_python_wire/_proto"]

[tool.mypy]
python_version = "3.13"
files = ["cannet_python_wire"]
# Don't type-check the generated gRPC/protobuf stubs.
exclude = ["cannet_python_wire/_proto/"]
# python-can and grpc ship without type stubs; this package treats them
# dynamically already.
ignore_missing_imports = true

# The protobuf gencode is dynamically populated, so mypy can't see its
# attributes — treat it as untyped rather than annotate generated code.
[[tool.mypy.overrides]]
module = "cannet_python_wire._proto.*"
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
