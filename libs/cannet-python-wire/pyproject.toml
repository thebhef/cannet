[project]
name = "cannet-python-wire"
version = "0.1.0"
description = "The cannet wire encoding in Python: the checked-in gRPC gencode, the wire Frame, and the mappers either side of it."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }

# Hard runtime deps, and only what the moved code actually touches.
# `grpcio` / `protobuf` are what the checked-in gencode in `_proto/`
# needs to load and to serve; `python-can` is the other end of the
# `Message` <-> `Frame` seam. grpcio 1.84.0+ / protobuf 7.35.1+ are the
# floor — the exact versions the checked-in gencode's own
# `ValidateProtobufRuntimeVersion` / `GRPC_GENERATED_VERSION` checks
# demand, read off the stubs after regenerating with the locked
# `grpcio-tools`. No upper bounds: `uv lock --upgrade` pulls current
# wheels, and all three Python packages are re-locked together so they
# land on the same grpcio/protobuf/grpcio-tools/ruff version set.
#
# `python-can` is imported defensively in `python_can.py` for the same
# reason the sidecar's driver does it: the sidecar must boot on a
# machine with no vendor SDK. Declaring it here lets `uv sync` install
# it as part of the default flow.
dependencies = [
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
    "python-can>=4.6",
]

[project.optional-dependencies]
# Pulled in by `uv sync --extra dev` for regenerating the proto stubs
# and running the tests. Kept out of the default install so the runtime
# venv stays small, matching the sidecar's and the client's split.
#
# ruff's default rule selection changes between 0.15 and 0.16 (E4xx
# out; I/UP/S/PL/RUF in) rather than only widening — the same file
# would lint differently on either side of that boundary, which is
# exactly what a shared package must not do. `[tool.ruff.lint] select`
# below makes the previously-implicit 0.15 default (`E4`, `E7`, `E9`,
# `F`) explicit and identical across all three packages, so the 0.16
# uplift changes the version, not the enforced rule set.
#
# grpcio-tools has no upper pin: **the generator and the runtimes it
# regenerates for are re-locked together, in the same change, every
# time.** Every generated stub records the toolchain that emitted it
# and refuses to import under an older runtime — `_pb2.py` against the
# protobuf runtime, `_pb2_grpc.py` against grpcio — so a grpcio-tools
# bump always comes with the matching `grpcio`/`protobuf` floor bump
# above, a `scripts/regen_proto.sh` run, and a re-lock of the sidecar
# and the client to the same versions in the same change. The CI
# `uv lock --check` step in each of the three Python jobs (added with
# this change) is what makes a lock that fell behind a build failure
# rather than a latent one; the gencode-drift check (ADR 0059) remains
# the guard against a stale `_proto/` tree.
dev = [
    "grpcio-tools>=1.80",
    "pytest>=9",
    "ruff>=0.16,<0.17",
    "mypy>=1.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cannet_python_wire"]

# Generated gRPC/protobuf stubs live in `_proto/` and are excluded from
# linting, formatting, and type-checking — they're machine-emitted and
# regenerated, not hand-maintained.
[tool.ruff]
target-version = "py313"
extend-exclude = ["cannet_python_wire/_proto"]

# The rule set ruff 0.15 was enforcing by default, made explicit so a
# ruff version bump never silently changes what's enforced (see the
# `dev` extra comment above). Identical across all three Python
# packages.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
files = ["cannet_python_wire"]
# Don't type-check the generated gRPC/protobuf stubs.
exclude = ["cannet_python_wire/_proto/"]
# python-can and grpc ship without type stubs; this package treats them
# dynamically already.
ignore_missing_imports = true

# The protobuf gencode is dynamically populated, so mypy can't see its
# attributes — treat it as untyped rather than annotate generated code.
[[tool.mypy.overrides]]
module = "cannet_python_wire._proto.*"
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
